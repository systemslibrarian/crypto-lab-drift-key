# Grouped so an ecosystem's routine bumps arrive as ONE pull request instead of
# one per dependency. Ungrouped, this fleet reached 1,461 open pull requests
# across 176 repos, none of which had any CI signal because the only workflow
# fired on push to main.
#
# Majors are deliberately left OUT of the npm group. When the 2026-08-18 backlog
# was landed by hand, 109 bumps had to be held back and they were overwhelmingly
# majors -- a breaking major inside the grouped pull request makes the whole
# thing unmergeable, which is the hand-unpicking this exists to prevent.
#
# Two majors worth knowing for this lab specifically. TypeScript 5 -> 7 stops
# tolerating an undeclared side-effect import, so a Vite lab missing
# src/vite-env.d.ts fails with TS2882 on `import "./style.css"` -- this repo has
# that file. And vitest 2 -> 4 makes timeouts actually enforceable rather than
# racing a timer a non-yielding test never lets run, which is why
# vite.config.ts sets an explicit testTimeout for the exhaustive BCH sweeps.
#
# github-actions majors ARE grouped: checkout v4->v7, setup-node v4->v7 and the
# Pages v5/v6 jumps were verified green across all 176 repos on 2026-08-18.
#
# Both groups auto-merge once this lab's own gate passes on the pull request --
# see the dependabot-auto-merge job in .github/workflows/deploy.yml.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
