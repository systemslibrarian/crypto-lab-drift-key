name: Deploy to GitHub Pages

# One workflow, three triggers, and each is load-bearing.
#
#   push            deploys main.
#   pull_request    runs the SAME gate on a pull request without deploying, so a
#                   Dependabot bump has CI signal and the auto-merge job below
#                   has something to depend on. Without it this lab would open
#                   one pull request per dependency with no run on any of them.
#   workflow_dispatch  lets a deploy be re-run by hand, and is what the
#                   auto-merge job dispatches after it merges: a merge made with
#                   GITHUB_TOKEN raises no push event, so nothing else would.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # NOT a bare `pages`: with cancel-in-progress a pull-request run would cancel
  # a live main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes, which is where a hung job's six silent
    # hours come from. This suite runs in about three minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The WHOLE suite gates the deploy, not just the accessibility half.
      # A 2026-08-14 sweep found 29 repos running `test:a11y` alone, so their
      # unit and algorithmic suites never blocked a publish -- they could ship a
      # build whose cryptography was broken so long as the browser specs passed.
      - name: Unit tests (Vitest -- BCH, the sketch, HKDF RFC 5869 vectors, the model)
        run: npm test

      - name: Build (typecheck gates the build)
        run: npm run build

      # Never `--with-deps`. That apt step wedged 547 CI runs across this fleet,
      # and the ubuntu-latest image already carries what Chromium needs.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Accessibility gate (axe-core, WCAG 2.1 A/AA, desktop and 380px)
        run: npm run test:a11y

      - name: Claims suite (does the page tell the truth, incl. the negative claim)
        run: npm run test:claims

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # NOT `== 'push'`. They read as equivalent and are not: `== 'push'` also
    # skips workflow_dispatch, which is the one trigger the auto-merge job below
    # depends on -- the dispatched run would build, pass the gate, and skip the
    # deploy, so the site would still never update.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: build` is the whole safety argument: the gate
  # decides, not the version number, so a major that breaks this lab fails the
  # gate and the pull request stays open for a human.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge any bump whose gate went green
        # Retry: a sibling pull request merging first moves main underneath us
        # and GitHub rejects with "Base branch was modified". That is benign, so
        # try again rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # Dispatch the file THIS lab has: most are deploy.yml, some deploy-pages.yml
          # or pages.yml. A copied name 404s only on the auto-merge path, after the
          # merge has landed. See §6.2.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
